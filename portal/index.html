    :root[data-theme="dark"] {

    .logo strong {display:block;letter-spacing:-.8px;font-size:18px;font-weight:850;line-height:1.3;}
    .logo small {font-size:10px;color:var(--muted);display:block;margin-top:2px;letter-spacing:.2px;}
    .nav-label {font-size:11px;color:var(--faint);letter-spacing:1.1px;font-weight:800;padding:9px 14px 8px;}
    .nav {display:grid;gap:4px;}
    .nav-btn {appearance:none;display:flex;align-items:center;gap:12px;width:100%;padding:12px 13px;border-radius:11px;background:transparent;border:0;color:var(--muted);font-weight:700;text-align:left;}

    .nav-btn .emoji {font-size:18px;width:22px;text-align:center;}

    .crumb strong {color:var(--ink);}
    .actions {display:flex;align-items:center;gap:7px;}
    .iconbtn {height:36px;min-width:36px;border:1px solid var(--line);background:var(--white);border-radius:10px;color:var(--muted);padding:0 10px;display:grid;place-items:center;font-weight:700;}

    .original-frame {width:100%;height: min(800px,78vh);min-height:480px;border:1px solid var(--line);border-radius:15px;background:var(--white);}
    .manual-topbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin:14px 0;}
    .manual-meta {color:var(--muted);font-size:12px;}

    :root[data-theme="dark"] .warning{background:#3b3321;color:#f9dfac;border-color:#695631}

    .modal-backdrop{position:fixed;inset:0;background:#08172c99;z-index:80;display:flex;align-items:center;justify-content:center;padding:16px;}
    .modal{background:var(--white);border:1px solid var(--line);border-radius:19px;width:min(630px,100%);max-height:92vh;overflow:auto;padding:25px;box-shadow:0 18px 80px #0003;}
    .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px;}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;}
    .field{display:flex;flex-direction:column;gap:5px;margin-bottom:13px;}
    .field label{font-size:12px;font-weight:800;color:var(--muted)}
    .field input,.field textarea,.field select{min-height:42px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;}

    .modal-footer {display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;}
    .footline {border-top:1px solid var(--line);padding-top:17px;margin-top:38px;font-size:11px;color:var(--faint);display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;}
    .toast{position:fixed;bottom:25px;left:50%;transform:translate(-50%,12px);z-index:100;background:var(--navy);color:#fff;padding:11px 18px;border-radius:30px;box-shadow:0 9px 30px #0003;opacity:0;pointer-events:none;transition:.2s;font-weight:700;font-size:13px;}
    .toast.show{opacity:1;transform:translate(-50%,0)}
    .footer-link {color:var(--blue);font-weight:800;}
    @media(max-width:1000px){.app{grid-template-columns:200px minmax(0,1fr)}.sidebar{padding-inline:10px}.content{padding:28px}.topbar{padding-inline:28px}.quick-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:690px){
      .app{display:block}.sidebar{display:none;position:fixed;top:0;left:0;bottom:0;height:100vh;width:255px;box-shadow:0 0 0 100vw #0005;z-index:70}.sidebar.open{display:flex}
      #menuBtn{display:grid}.topbar{height:61px;padding:0 16px}.content{padding:20px 15px 70px}.hero-holder img{max-height:260px}
      .feature-grid{grid-template-columns:1fr;gap:11px}.feature-card{min-height:145px;padding:17px}.feature-card .feature-ic{margin-bottom:8px}.feature-card p{margin:5px 0 12px}.quick-grid{grid-template-columns:repeat(2,1fr)}
      .intro-row{margin-bottom:14px}h1{font-size:26px}.section-head{margin-top:24px}.info-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}
      .monitor-banner{align-items:flex-start;flex-direction:column}.search-row{display:block}.search-row>*{margin-top:8px}.search-row>.search-box{margin-top:0}.search-row>.btn{width:100%}
      .hero-tag{font-size:10px}.original-frame{min-height:520px}.modal{padding:18px}
    }
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>

  function aliasMatch(name,q){let a=String(name||'').toLowerCase().replace(/\s/g,'');let b=String(q||'').toLowerCase().replace(/\s/g,'');if(!b)return true;if(a.includes(b))return true;const aliases={'삼화':'삼성화재','삼생':'삼성생명','한생':'한화생명','한손':'한화손해보험','메트':'메트라이프','카디프':'카디프생명','현해':'현대해상','디비':'db','흥생':'흥국생명','흥화':'흥국화재'};return Object.entries(aliases).some(([k,v])=>b===k&&a.includes(v.toLowerCase()));}

    if(state.monitorLoading)return `<div class="empty"><div class="empty-emoji">⏳</div><h3>원본 데이터를 연결하고 있어요</h3><p>등록된 보험사 정보는 기존 GitHub 사이트에서 직접 불러옵니다.</p></div>`;
    if(state.monitorFailed)return `<div class="empty"><div class="empty-emoji">🔗</div><h3>자동 데이터 연결에 실패했어요</h3><p>네트워크 또는 브라우저 보안 설정 때문일 수 있어요. 기존 화면 탭으로 전환하거나 원본 사이트를 열어보세요.</p><button type="button" class="btn primary" data-monitormode="original">기존 화면 보기</button> <a class="btn" href="${SOURCE}" target="_blank" rel="noopener noreferrer">원본 열기 ↗</a></div>`;

  function monitorCard(x){const id='mo:'+x.name;const open=state.openMonitor===id;return `<article class="item"><div style="display:flex;align-items:center;">
    <button type="button" class="item-top" data-monitoropen="${esc(id)}" aria-expanded="${open}"><span class="item-icon">${x.category==='손보'?'🟢':'🔵'}</span><span class="item-main"><span class="item-title">${esc(x.name)}</span><span class="item-descr">${esc(x.category)} · 마감기한 / 전화 / 모바일 / 비고</span></span><span class="item-right">${open?'⌃':'⌄'}</span></button>

  function flattenField(obj){if(obj===null||obj===undefined||obj==='')return '';if(typeof obj==='string'||typeof obj==='number')return String(obj);if(Array.isArray(obj))return obj.map(flattenField).filter(Boolean).join('\n');return Object.entries(obj).map(([k,v])=>k==='_raw'?flattenField(v):`${k}: ${flattenField(v)}`).filter(Boolean).join('\n');}

  function actionPhone(name,num){const digits=countDigits(num);if(digits.length<7)return '';return `<button type="button" class="btn tiny" data-phone="${esc(digits)}" data-phonekind="${esc(name)}">📞 ${esc(name)} ${esc(num)}</button><button type="button" class="btn tiny" data-copy="${esc(num)}" title="번호 복사">복사</button>`;}
  function directLinks(obj){if(!obj)return '';return ['web','mobile'].map(type=>{const row=obj[type];const url=row&&safeUrl(row.url);return url?`<a class="btn tiny" target="_blank" rel="noopener noreferrer" href="${esc(url)}">↗ ${type==='web'?'웹':'모바일'} 링크 열기</a><button type="button" class="btn tiny" data-copy="${esc(url)}">링크 복사</button>`:''}).join('');}

  function manualPage(){return `

  function manualResults(){const search=state.manualQuery.trim().toLowerCase();const list=state.manual.filter(x=>(state.manualFilter==='전체'||x.category===state.manualFilter) && [x.title,x.company,x.category,x.tags,x.body].join(' ').toLowerCase().includes(search));return `<div class="result-meta">검색 결과 ${list.length}개</div><div class="items">${list.map(manualCard).join('')||`<div class="empty"><div class="empty-emoji">📖</div><h3>${state.manual.length?'해당하는 매뉴얼이 없어요':'아직 매뉴얼 데이터가 없어요'}</h3><p>${state.manual.length?'다른 키워드로 검색해 보세요.':'우선 매뉴얼을 직접 추가하거나, JSON으로 준비된 데이터를 가져올 수 있어요. 기존 클로드 사이트의 실제 자료는 별도로 이전해야 합니다.'}</p><button class="btn primary" type="button" id="addManualEmpty">＋ 매뉴얼 등록하기</button></div>`}</div>`}

      state.monitor=json.filter(x=>x&&typeof x.name==='string');state.monitorFailed=false;
    }catch(e){state.monitorFailed=true;console.warn('원본 모니터링 자료 연결 실패',e)}finally{state.monitorLoading=false;render();}}
  async function loadManual(){try{const r=await fetch('./manual-data.json',{cache:'no-store'});if(!r.ok)throw new Error('file');const arr=await r.json();state.manual=Array.isArray(arr)?arr.filter(validManual):[];state.manualError=false;}catch(e){state.manual=[];state.manualError=true;}
    const map=new Map(state.manual.map(x=>[x.id,x]));for(const x of saved.manualDrafts||[])if(validManual(x))map.set(x.id,x);state.manual=[...map.values()];render();}
  function validManual(x){return x&&typeof x.id==='string'&&typeof x.title==='string'&&typeof x.body==='string';}
  function openEditor(id){const cur=id?state.manual.find(x=>x.id===id):null;const categories=CATS.slice(1);
    $('#modalRoot').innerHTML=`<div class="modal-backdrop" id="modalBg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="editHeading"><div class="modal-head"><h2 id="editHeading">${cur?'매뉴얼 수정':'매뉴얼 추가'}</h2><button type="button" class="iconbtn" id="modalClose" aria-label="닫기">✕</button></div>
      <form id="manualForm"><input type="hidden" name="id" value="${esc(cur?.id||'')}"><div class="form-grid"><div class="field"><label for="mTitle">제목 *</label><input id="mTitle" name="title" required maxlength="130" value="${esc(cur?.title||'')}" placeholder="예: 변액서류 신청방법"></div><div class="field"><label for="mCompany">보험사</label><input id="mCompany" name="company" maxlength="80" value="${esc(cur?.company||'')}" placeholder="예: 공통 / 보험사명"></div></div>
      <div class="form-grid"><div class="field"><label for="mCategory">분류</label><select id="mCategory" name="category">${categories.map(c=>`<option ${c===(cur?.category||'기타')?'selected':''} value="${esc(c)}">${esc(c)}</option>`).join('')}</select></div><div class="field"><label for="mTags">키워드 (쉼표로 구분)</label><input id="mTags" name="tags" maxlength="250" value="${esc(cur?.tags||'')}" placeholder="예: 서류, 신청, 합격증"></div></div>
      <div class="field"><label for="mBody">매뉴얼 내용 *</label><textarea id="mBody" name="body" required placeholder="정확한 업무 처리 방법을 입력해 주세요.">${esc(cur?.body||'')}</textarea></div>
      <p class="smallnote" style="margin-bottom:16px">이 화면에서 저장하면 현재 브라우저에만 임시 저장됩니다. 내보낸 JSON을 GitHub에 게시해야 다른 사용자도 볼 수 있습니다.</p>
      <div class="modal-footer"><button type="button" id="cancelEditor" class="btn">취소</button><button type="submit" class="btn primary">현재 브라우저에 저장</button></div></form></div></div>`;
    $('#mTitle').focus();}
  function closeEditor(){$('#modalRoot').innerHTML='';}
  function upsertManual(form){const fd=new FormData(form);const id=String(fd.get('id')||'').trim()||'manual-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6);
    const item={id,title:String(fd.get('title')||'').trim(),company:String(fd.get('company')||'').trim(),category:String(fd.get('category')||'기타'),tags:String(fd.get('tags')||'').trim(),body:String(fd.get('body')||'').trim()};
    if(!item.title||!item.body)return notice('제목과 내용을 입력해 주세요.');
    saved.manualDrafts=(saved.manualDrafts||[]).filter(x=>x.id!==id).concat(item);save();state.manual=state.manual.filter(x=>x.id!==id).concat(item);closeEditor();state.openManual=item.id;go('manual');render();notice('이 브라우저에 임시 저장했어요.');}
  function importManualFile(file){if(!file)return;file.text().then(txt=>{let data;try{data=JSON.parse(txt);}catch{return notice('JSON 파일 형식을 확인해 주세요.')}if(!Array.isArray(data)||!data.every(validManual))return notice('배열 형식의 매뉴얼 JSON이 필요해요.');
    const map=new Map([...state.manual,...data].map(x=>[x.id,x]));state.manual=[...map.values()];saved.manualDrafts=state.manual;save();render();notice(`${data.length}개 항목을 가져왔어요. 공유하려면 JSON을 게시해 주세요.`)}).catch(()=>notice('파일을 읽을 수 없어요.'));}
  function exportManual(){const blob=new Blob([JSON.stringify(state.manual,null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='manual-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);notice('JSON 파일을 저장했어요. GitHub에 게시하면 공동 사용 가능합니다.');}
  document.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.manualcat){state.manualFilter=b.dataset.manualcat;go('manual');return;}
    if(b.dataset.page){if(b.dataset.monitorfilter)state.monitorFilter=b.dataset.monitorfilter;go(b.dataset.page);return;}
    if(b.dataset.favorite){favorite(b.dataset.favorite);return;}
    if(b.dataset.monitorfilter){state.monitorFilter=b.dataset.monitorfilter;refreshMonitorTabUI();return;}
    if(b.dataset.manualfilter){state.manualFilter=b.dataset.manualfilter;render();const s=$('#pageSearch');if(s)s.focus({preventScroll:true});return;}
    if(b.dataset.monitormode){state.monitorMode=b.dataset.monitormode;render();return;}
    if(b.dataset.monitoropen){state.openMonitor=state.openMonitor===b.dataset.monitoropen?null:b.dataset.monitoropen;refreshItems();return;}
    if(b.dataset.detailtab){state.monitorTab=b.dataset.detailtab;refreshItems();return;}
    if(b.dataset.manualopen){state.openManual=b.dataset.manualopen;const manual=state.manual.find(x=>x.id===state.openManual);if(manual){el.innerHTML=manualDetailPage(manual);window.scrollTo({top:0,behavior:'instant'})}return;}
    if(b.dataset.editmanual){openEditor(b.dataset.editmanual);return;}
    if(b.dataset.deletemanual){if(!window.confirm('매뉴얼을 삭제할까요? (현재 브라우저의 수정본에만 반영됩니다.)'))return;
      state.manual=state.manual.filter(x=>x.id!==b.dataset.deletemanual);saved.manualDrafts=state.manual;save();render();notice('삭제했어요. 내보내기 후 게시하면 다른 사용자에게 반영됩니다.');return;}
    if(b.dataset.copy){navigator.clipboard?.writeText(b.dataset.copy).then(()=>notice('클립보드에 복사했어요.')).catch(()=>window.prompt('복사할 내용',b.dataset.copy));return;}
    if(b.dataset.phone){if(window.confirm(`${b.dataset.phonekind||'전화'} ${b.dataset.phone}로 전화할까요?`))location.href='tel:'+b.dataset.phone;return;}
    if(b.id==='addManual'||b.id==='addManualEmpty'){openEditor();return;}
    if(b.id==='exportManual'){exportManual();return;}
    if(b.id==='importManual'){$('#jsonInput').click();return;}
    if(b.id==='reloadMonitor'){loadMonitor();return;}
    if(b.id==='backToManual'){state.openManual=null;render();return;}
    if(['modalClose','cancelEditor'].includes(b.id)){closeEditor();return;}
  });
  function refreshMonitorTabUI(){render();}
  $('#jsonInput').addEventListener('change',e=>{importManualFile(e.target.files[0]);e.target.value='';});
  document.addEventListener('submit',e=>{if(e.target.getAttribute('id')==='manualForm'){e.preventDefault();upsertManual(e.target)}});
  $('#menuBtn').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));
  $('#fontDown').addEventListener('click',()=>{saved.font=Math.max(.85,Math.round((saved.font-.05)*100)/100);save();applyPrefs()});
  $('#fontUp').addEventListener('click',()=>{saved.font=Math.min(1.25,Math.round((saved.font+.05)*100)/100);save();applyPrefs()});
  $('#themeBtn').addEventListener('click',setTheme);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeEditor();$('#sidebar').classList.remove('open')}});
  window.addEventListener('hashchange',syncPage);
  applyPrefs();syncPage();loadMonitor();loadManual();
</script>
</body>
</html>
