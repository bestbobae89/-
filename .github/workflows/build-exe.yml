name: build-exe
on:
  push:
    branches: [3jong-exe]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Korean OCR language (for testing only)
        shell: powershell
        continue-on-error: true
        run: |
          Add-WindowsCapability -Online -Name "Language.OCR~~~ko-KR~0.0.1.0"
          Get-WindowsCapability -Online | Where-Object { $_.Name -Like 'Language.OCR*' -and $_.State -eq 'Installed' } | Format-Table Name,State
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt -r app/requirements-ocr.txt pyinstaller
      - name: Test with Python
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $env:PYTHONIOENCODING = "utf-8"
          python tests/ci_test.py 2>&1 | Tee-Object -FilePath out/ci_test.txt
      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name GoodRich3jong
          --add-data "app/ui;ui" --add-data "app/insurers.json;."
          --collect-all winrt --collect-all webview --collect-all pymupdf --collect-all fitz
          --hidden-import clr --paths app app/main.py
      - name: Test exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\GoodRich3jong.exe" -ArgumentList "--selftest" -Wait -PassThru
          "exit code: $($p.ExitCode)"
          Get-Content -Encoding utf8 "dist\selftest.txt" | Tee-Object -FilePath out/exe_selftest.txt
          Remove-Item "dist\selftest.txt"
          "exit code: $($p.ExitCode)" | Add-Content out/exe_selftest.txt
      - name: Publish to branch
        shell: pwsh
        run: |
          $f = Get-Item dist\GoodRich3jong.exe
          "size: $($f.Length)" | Add-Content out/exe_selftest.txt
          $bytes = [IO.File]::ReadAllBytes($f.FullName)
          $chunk = 40MB; $n = 0
          for ($o = 0; $o -lt $bytes.Length; $o += $chunk) {
            $len = [Math]::Min($chunk, $bytes.Length - $o)
            [IO.File]::WriteAllBytes("out/GoodRich3jong.exe.part$n", $bytes[$o..($o + $len - 1)])
            $n++
          }
          (Get-FileHash $f.FullName -Algorithm SHA256).Hash | Set-Content out/sha256.txt
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan 3jong-exe-out
          git rm -rq --cached .
          git add out
          git commit -q -m "build output $env:GITHUB_SHA"
          git push -f origin 3jong-exe-out
      - uses: actions/upload-artifact@v4
        with:
          name: GoodRich3jong
          path: dist/GoodRich3jong.exe
          retention-days: 14
