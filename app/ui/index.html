<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>3종서류 자동 분할</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1f2933;--sub:#5f6b7a;--line:#dde2e8;--blue:#1c64f2;--blue-l:#eaf1ff;
--ok:#1b7a3d;--ok-l:#e6f6ec;--wa:#8a5a00;--wa-l:#fff3c4;--er:#b42318;--er-l:#fde4e2}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","맑은 고딕","Noto Sans CJK KR",sans-serif;font-size:16px;overflow:hidden}
button{font-family:inherit}
.screen{display:none;height:100vh;flex-direction:column}.screen.on{display:flex}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;gap:14px}
header h1{font-size:19px;margin:0}
.steps{margin-left:auto;display:flex;gap:6px;font-size:14px;color:var(--sub)}
.steps b{padding:5px 12px;border-radius:14px;background:#eef1f5;font-weight:600}
.steps b.on{background:var(--blue);color:#fff}
main{flex:1;padding:20px 24px;overflow:hidden;display:flex;flex-direction:column;gap:16px;min-height:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.q{font-size:15px;font-weight:700;color:var(--sub);margin-bottom:10px}
.seg{display:inline-flex;gap:8px;flex-wrap:wrap}
.seg button{font-size:17px;padding:11px 24px;border-radius:8px;border:2px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
.seg button:hover:not(:disabled){border-color:#9dbcf7}
.seg button.on{border-color:var(--blue);background:var(--blue);color:#fff;font-weight:700}
.seg button:disabled{background:#f1f3f6;color:#8a94a3;border-color:#e3e7ec;cursor:default}
.hint{font-size:14px;color:var(--sub);margin-top:8px}
.hint.err{color:var(--er);font-weight:700}
.drop{flex:1;min-height:180px;border:3px dashed #9dbcf7;background:var(--blue-l);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:.15s}
.drop.over{background:#dbe7ff;border-color:var(--blue)}
.drop .big{font-size:24px;font-weight:700}
.btn{font-size:16px;font-weight:700;padding:10px 22px;border-radius:8px;border:2px solid var(--line);background:#fff;cursor:pointer;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:#9dbcf7}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.p:hover{background:#1452d4}
.btn.sm{font-size:14px;padding:6px 12px}
.btn:disabled{opacity:.45;cursor:default}
.path{display:flex;align-items:center;gap:12px}
.path .v{flex:1;background:#f1f3f6;border-radius:6px;padding:10px 14px;font-size:15px}
.path .v.empty{color:var(--er);font-weight:700}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.bar{width:560px;max-width:90%;height:16px;background:#e3e8ef;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--blue);transition:width .3s}
.center .big{font-size:24px;font-weight:700}.center .s{color:var(--sub)}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top .t{font-size:21px;font-weight:700;margin-right:6px}
.chip{font-size:15px;font-weight:700;padding:6px 12px;border-radius:16px}
.c-ok{background:var(--ok-l);color:var(--ok)}.c-wa{background:var(--wa-l);color:var(--wa)}
.nav{margin-left:auto;display:flex;align-items:center;gap:8px;font-weight:700;color:var(--wa)}
.banner{background:var(--wa-l);color:var(--wa);border-radius:8px;padding:10px 14px;font-weight:700;font-size:15px}
.body{flex:1;display:flex;gap:16px;min-height:0}
.tbl{flex:1;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px;min-width:0}
table{border-collapse:collapse;width:100%;font-size:15px}
th{position:sticky;top:0;z-index:1;background:#f1f3f6;text-align:left;padding:10px 6px;border-bottom:2px solid var(--line);white-space:nowrap;font-size:14px;color:#3b4652}
td{padding:5px 6px;border-bottom:1px solid #eef1f4;white-space:nowrap;cursor:pointer}
tr.wa td{background:#fffbea}
tr.sel td{background:var(--blue-l)!important;box-shadow:inset 0 1px 0 var(--blue),inset 0 -1px 0 var(--blue)}
tr.sel td:first-child{box-shadow:inset 4px 0 0 var(--blue),inset 0 1px 0 var(--blue),inset 0 -1px 0 var(--blue)}
td input,td select{font:inherit;font-size:15px;border:2px solid transparent;border-radius:4px;padding:3px 5px;background:transparent;color:var(--ink);width:100%;min-width:56px}
td select{min-width:96px;cursor:pointer}
td input:hover,td select:hover{border-color:#cdd5df;background:#fff}
td input:focus,td select:focus{border-color:var(--blue);background:#fff;outline:0}
td input.miss,td select.miss{border-color:#e0a800;background:#fffdf0}
td input::placeholder{color:#9aa4b1}
td.no{color:var(--sub);width:34px}
.ver{font-weight:700}.ver.old{color:#8a5a00}
.st{font-weight:700;font-size:14px}.st.ok{color:var(--ok)}.st.wa{color:var(--wa)}
.ack{font-size:12px;padding:2px 7px;margin-left:6px;border-radius:5px;border:1px solid #d9c27a;background:#fff;color:var(--wa);cursor:pointer;font-weight:700}
td.fn{font-size:13px;color:var(--sub);max-width:300px;overflow:hidden;text-overflow:ellipsis}
.prev{width:360px;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;gap:10px;flex-shrink:0}
.prev .h{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.prev .pg{flex:1;min-height:0;background:#e9edf2;border-radius:6px;overflow:auto;display:flex}
.prev .pg img{margin:auto;max-width:100%;max-height:100%;box-shadow:0 1px 6px rgba(0,0,0,.2);background:#fff}
.prev .pg.zoom img{max-width:none;max-height:none}
.prev .ctl{display:flex;justify-content:space-between;align-items:center;gap:6px}
.thumbs{display:flex;gap:6px;overflow-x:auto;min-height:66px}
.thumbs img{height:62px;border:2px solid transparent;border-radius:3px;cursor:pointer;background:#fff}
.thumbs img.on{border-color:var(--blue)}
footer{background:#fff;border-top:1px solid var(--line);padding:12px 24px;display:flex;justify-content:space-between;align-items:center}
.done .ic{width:84px;height:84px;border-radius:50%;background:var(--ok-l);color:var(--ok);font-size:46px;display:flex;align-items:center;justify-content:center;font-weight:700}
.done .ic.bad{background:var(--er-l);color:var(--er)}
.files{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 16px;font-size:14px;color:var(--sub);width:640px;max-width:90%;line-height:1.8;max-height:220px;overflow:auto}
.modal{position:fixed;inset:0;background:rgba(20,28,38,.45);display:none;align-items:center;justify-content:center;z-index:10}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:12px;padding:26px 28px;width:460px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal .mt{font-size:20px;font-weight:700;margin-bottom:10px}
.modal .mb{color:var(--sub);line-height:1.6;margin-bottom:22px;white-space:pre-line}
.modal .mf{display:flex;justify-content:flex-end;gap:10px}
</style></head>
<body>

<!-- ① 시작 -->
<section class="screen on" id="start">
<header><h1>3종서류 자동 분할</h1><div class="steps"><b class="on">1 파일 넣기</b><b>2 확인</b><b>3 완료</b></div></header>
<main>
 <div class="card">
  <div class="q">① 서류 종류</div>
  <div class="seg" id="kind"><button data-v="3종서류">3종서류</button><button data-v="청약서만">청약서만</button><button data-v="청약서+3종">청약서 + 3종</button></div>
  <div class="q" style="margin-top:16px">② 상품 구분</div>
  <div class="seg" id="cat"><button data-v="장기">장기</button><button data-v="자동차">자동차</button><button data-v="일반">일반</button></div>
  <div class="hint" id="kindHint">3종서류만 넣을 때는 상품 구분을 고르지 않아도 돼요.</div>
 </div>
 <div class="drop" id="drop"><div style="font-size:44px;color:var(--blue)">⬇</div><div class="big">여기에 스캔 PDF를 끌어다 놓으세요</div><button class="btn" id="pick">파일 선택</button></div>
 <div class="card path"><b>저장 위치</b><div class="v" id="outDir"></div><button class="btn" id="chooseOut">변경</button></div>
</main>
</section>

<!-- 처리 중 -->
<section class="screen" id="work">
<header><h1>3종서류 자동 분할</h1><div class="steps"><b class="on">1 파일 넣기</b><b>2 확인</b><b>3 완료</b></div></header>
<main><div class="center">
 <div class="big">서류를 읽고 있어요…</div>
 <div class="bar"><i id="bar"></i></div>
 <div class="s" id="workFile"></div>
 <div class="s" id="workMsg"></div>
</div></main>
</section>

<!-- ② 확인 -->
<section class="screen" id="review">
<header><h1>3종서류 자동 분할</h1><div class="steps"><b>1 파일 넣기</b><b class="on">2 확인</b><b>3 완료</b></div></header>
<main>
 <div class="top">
  <span class="t" id="rvTitle"></span>
  <span class="chip c-ok" id="chipOk"></span><span class="chip c-wa" id="chipWa"></span>
  <div class="nav"><button class="btn sm" id="prevW">◀ 이전 확인 필요</button><span id="navPos"></span><button class="btn sm" id="nextW">다음 확인 필요 ▶</button></div>
 </div>
 <div class="banner" id="banner" style="display:none"></div>
 <div class="body">
  <div class="tbl"><table><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table></div>
  <div class="prev">
   <div class="h"><span id="pvTitle"></span><span id="pvSub" style="color:var(--sub);font-weight:400;font-size:14px"></span></div>
   <div class="pg" id="pvBox"><img id="pvImg" alt=""></div>
   <div class="thumbs" id="thumbs"></div>
   <div class="ctl"><button class="btn sm" id="pgPrev">◀</button><span id="pgPos"></span><button class="btn sm" id="pgNext">▶</button><button class="btn sm" id="zOut">－</button><button class="btn sm" id="zIn">＋ 확대</button></div>
  </div>
 </div>
</main>
<footer><button class="btn" id="toStart">처음으로</button><span style="color:var(--sub)">칸을 누르면 바로 고칠 수 있어요</span><button class="btn p" id="saveBtn">저장하기</button></footer>
</section>

<!-- ③ 완료 -->
<section class="screen" id="done">
<header><h1>3종서류 자동 분할</h1><div class="steps"><b>1 파일 넣기</b><b>2 확인</b><b class="on">3 완료</b></div></header>
<main><div class="center done">
 <div class="ic" id="doneIc">✔</div>
 <div style="font-size:26px;font-weight:700" id="doneTitle"></div>
 <div class="s" id="doneDir"></div>
 <div class="files" id="doneFiles"></div>
 <div style="display:flex;gap:10px"><button class="btn p" id="openDir">폴더 열기</button><button class="btn" id="again">처음으로</button></div>
</div></main>
</section>

<div class="modal" id="modal"><div class="box"><div class="mt" id="mT"></div><div class="mb" id="mB"></div><div class="mf" id="mF"></div></div></div>

<script>
const $=s=>document.querySelector(s);
const S={mode:'3종서류',cat:'',path:'',outDir:'',insurers:[],items:[],names:[],sel:0,pg:0,zoom:0,ocr:'',ocrNote:''};
let api=null;
function show(id){document.querySelectorAll('.screen').forEach(e=>e.classList.toggle('on',e.id===id))}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function modal(title,body,buttons){return new Promise(res=>{$('#mT').textContent=title;$('#mB').textContent=body;const f=$('#mF');f.innerHTML='';
 buttons.forEach(([label,val,primary])=>{const b=document.createElement('button');b.className='btn'+(primary?' p':'');b.textContent=label;b.onclick=()=>{$('#modal').classList.remove('on');res(val)};f.appendChild(b)});
 $('#modal').classList.add('on')})}

/* ---------- 시작 화면 */
function renderStart(){
 document.querySelectorAll('#kind button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.mode));
 const need=S.mode!=='3종서류';
 document.querySelectorAll('#cat button').forEach(b=>{b.disabled=!need;b.classList.toggle('on',need&&b.dataset.v===S.cat)});
 const h=$('#kindHint');h.classList.remove('err');
 h.textContent=need?(S.cat?`파일 이름 앞에 "${S.cat}"가 붙어요.`:'상품 구분을 골라주세요.'):'3종서류만 넣을 때는 상품 구분을 고르지 않아도 돼요.';
 const o=$('#outDir');o.textContent=S.outDir||'아직 정하지 않았어요 — [변경]을 눌러 정해주세요';o.classList.toggle('empty',!S.outDir);
}
document.querySelectorAll('#kind button').forEach(b=>b.onclick=()=>{S.mode=b.dataset.v;renderStart()});
document.querySelectorAll('#cat button').forEach(b=>b.onclick=()=>{S.cat=b.dataset.v;renderStart()});
$('#pick').onclick=async()=>{const p=await api.choose_file();if(p)window.onPicked(p)};
$('#chooseOut').onclick=async()=>{const d=await api.choose_folder();if(d){S.outDir=d;renderStart()}};
const drop=$('#drop');
['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();if(ev==='drop'||e.target===drop)drop.classList.remove('over')}));
window.onPicked=async(path)=>{
 S.path=path;
 if(S.mode!=='3종서류'&&!S.cat){const h=$('#kindHint');h.textContent='상품 구분(장기/자동차/일반)을 먼저 골라주세요. 고르면 바로 시작해요.';h.classList.add('err');
  document.querySelectorAll('#cat button').forEach(b=>b.onclick=()=>{S.cat=b.dataset.v;renderStart();document.querySelectorAll('#cat button').forEach(x=>x.onclick=()=>{S.cat=x.dataset.v;renderStart()});startJob()});return}
 startJob();
};
async function startJob(){
 const r=await api.start(S.path,S.mode,S.cat);
 if(!r.ok){await modal('시작할 수 없어요',r.msg,[['확인',1,true]]);return}
 show('work');$('#workFile').textContent=S.path.split(/[\\/]/).pop();poll();
}
async function poll(){
 const j=await api.progress();
 $('#bar').style.width=Math.round(100*j.done/j.total)+'%';$('#workMsg').textContent=j.msg||'';
 if(!j.finished){setTimeout(poll,350);return}
 if(j.error){await modal('처리 중 문제가 생겼어요',j.error+'\n\n같은 문제가 계속되면 기록 파일(log.txt)을 보내주세요.',[['처음으로',1,true]]);show('start');return}
 const r=await api.result();S.items=r.items;S.names=r.names;S.ocr=r.ocr;S.ocrNote=r.ocr_note;S.sel=firstWarn();S.pg=0;S.zoom=0;
 renderReview();show('review');
}

/* ---------- 확인 화면 */
function warnsOf(it){
 if(it.ack) return [];
 const w=[...(it.warns||[])];
 if(!it.ins) w.push('보험사 확인');
 if(!it.contractor) w.push('계약자 못 읽음');
 if(!it.agent) w.push('취급자 확인');
 if(S.mode!=='청약서만'&&!it.ver&&!w.some(x=>x.includes('빠짐')||x.includes('장수'))) w.push('버전 확인');
 return w;
}
function firstWarn(){const i=S.items.findIndex(it=>warnsOf(it).length);return i<0?0:i}
function cols(){const c=[['no','No'],['ver','버전'],['ins','보험사'],['agent','취급자'],['contractor','계약자'],['insured','피보험자'],['product','상품명']];
 if(S.mode!=='3종서류')c.push(['count','장수']);c.push(['st','상태'],['fn','저장될 파일 이름']);return c}
function renderReview(){
 $('#thead').innerHTML=cols().map(([k,l])=>`<th>${l}</th>`).join('');
 const tb=$('#tbody');tb.innerHTML='';
 const opts='<option value=""></option>'+S.insurers.map(n=>`<option>${esc(n)}</option>`).join('');
 S.items.forEach((it,idx)=>{
  const tr=document.createElement('tr');tr.dataset.idx=idx;
  tr.innerHTML=cols().map(([k])=>{
   if(k==='no')return `<td class="no">${it.no}</td>`;
   if(k==='ver')return `<td><select data-k="ver" style="min-width:58px"><option value=""></option><option>신</option><option>구</option></select></td>`;
   if(k==='ins')return `<td><select data-k="ins">${opts}</select></td>`;
   if(k==='insured')return `<td style="width:80px"><input data-k="insured" placeholder="같음"></td>`;
   if(k==='product')return `<td style="width:96px"><input data-k="product" placeholder="—" title="같은 사람·같은 보험사가 겹칠 때만 파일 이름에 붙어요" style="min-width:90px"></td>`;
   if(k==='count')return `<td>${it.count}장</td>`;
   if(k==='st')return `<td class="st"></td>`;
   if(k==='fn')return `<td class="fn"></td>`;
   return `<td style="width:${k==='contractor'?110:80}px"><input data-k="${k}"></td>`;
  }).join('');
  tr.querySelectorAll('[data-k]').forEach(el=>{el.value=it[el.dataset.k]||'';
   const on=()=>{it[el.dataset.k]=el.value.trim();it.ack=false;refreshRow(tr,it);updateSummary();scheduleNames()};
   el.addEventListener('input',on);el.addEventListener('change',on);el.addEventListener('focus',()=>select(idx,false))});
  tr.addEventListener('click',e=>{if(e.target.classList.contains('ack')){it.ack=true;refreshRow(tr,it);updateSummary();return}select(idx,false)});
  tb.appendChild(tr);refreshRow(tr,it);
 });
 const b=$('#banner');
 if(!S.ocr){b.style.display='';b.textContent='글자인식을 쓸 수 없어서 이름을 읽지 못했어요. 나누기와 버전 구분은 됐으니, 오른쪽 원본을 보고 칸에 직접 입력해 주세요.'}else b.style.display='none';
 updateSummary();select(S.sel,true);
}
function refreshRow(tr,it){
 const idx=+tr.dataset.idx,w=warnsOf(it);
 tr.classList.toggle('wa',w.length>0);tr.classList.toggle('sel',idx===S.sel);
 const st=tr.querySelector('.st');
 st.className='st '+(w.length?'wa':'ok');
 st.innerHTML=w.length?`⚠ ${esc(w[0])}${w.length>1?` 외 ${w.length-1}`:''}<button class="ack" title="확인했으면 누르세요">확인함</button>`:(it.ack?'✔ 확인함':'✔ 정상');
 st.title=w.join(', ');
 tr.querySelector('.fn').textContent=S.names[idx]||'';tr.querySelector('.fn').title=S.names[idx]||'';
 const v=tr.querySelector('[data-k=ver]');if(v)v.parentElement.classList.toggle('ver',1),v.style.color=it.ver==='구'?'#8a5a00':'';
 tr.querySelectorAll('[data-k=ins],[data-k=contractor],[data-k=agent]').forEach(el=>el.classList.toggle('miss',!it[el.dataset.k]));
}
function updateSummary(){
 const n=S.items.length,wn=S.items.filter(it=>warnsOf(it).length).length;
 $('#rvTitle').textContent=`${n}건을 찾았어요`;$('#chipOk').textContent=`✔ 정상 ${n-wn}`;
 $('#chipWa').textContent=`⚠ 확인 필요 ${wn}`;$('#chipWa').style.display=wn?'':'none';
 const wl=S.items.map((it,i)=>warnsOf(it).length?i:-1).filter(i=>i>=0),pos=wl.indexOf(S.sel);
 $('#navPos').textContent=wn?`⚠ ${pos>=0?pos+1:'-'} / ${wn}`:'모두 확인됨';
 $('#prevW').disabled=$('#nextW').disabled=!wn;
 $('#saveBtn').textContent=`저장하기 (${n}개)`;
}
let nameTimer=null;
function scheduleNames(){clearTimeout(nameTimer);nameTimer=setTimeout(async()=>{S.names=await api.names(S.items);
 document.querySelectorAll('#tbody tr').forEach(tr=>{const i=+tr.dataset.idx;tr.querySelector('.fn').textContent=S.names[i];tr.querySelector('.fn').title=S.names[i]})},250)}
function select(idx,scroll){
 if(idx<0||idx>=S.items.length)return;
 if(idx!==S.sel){S.pg=defaultPage(S.items[idx]);S.zoom=0}
 S.sel=idx;
 document.querySelectorAll('#tbody tr').forEach(tr=>tr.classList.toggle('sel',+tr.dataset.idx===idx));
 if(scroll){const tr=document.querySelector(`#tbody tr[data-idx="${idx}"]`);tr&&tr.scrollIntoView({block:'center'})}
 updateSummary();renderPreview();
}
function defaultPage(it){const g=it.pages.findIndex(p=>p.kind==='G');return g>=0?g:0}
const imgCache={};
async function pageImg(p,w){const k=`${p.i}_${p.rot}_${w}`;if(!imgCache[k])imgCache[k]=await api.page(p.i,p.rot||0,w);return imgCache[k]}
let pvToken=0;
async function renderPreview(){
 const it=S.items[S.sel];if(!it)return;const tok=++pvToken;
 $('#pvTitle').textContent=`No.${it.no} 원본`;
 $('#pvSub').textContent=`${it.ver?(it.ver==='구'?'구버전':'신버전')+' · ':''}${it.pages.length}장`;
 if(S.pg>=it.pages.length)S.pg=0;
 $('#pgPos').textContent=`${S.pg+1} / ${it.pages.length}쪽`;
 const th=$('#thumbs');
 if(th.dataset.for!==String(S.sel)){th.dataset.for=S.sel;th.innerHTML='';
  it.pages.forEach((p,k)=>{const im=document.createElement('img');im.onclick=()=>{S.pg=k;renderPreview()};th.appendChild(im);
   pageImg(p,140).then(src=>{if(th.dataset.for===String(S.sel))im.src=src})})}
 [...th.children].forEach((im,k)=>im.classList.toggle('on',k===S.pg));
 const box=$('#pvBox');box.classList.toggle('zoom',S.zoom>0);
 const w=S.zoom>0?1400:640;
 const src=await pageImg(it.pages[S.pg],w);if(tok!==pvToken)return;
 const img=$('#pvImg');img.src=src;img.style.width=S.zoom>0?(S.zoom===1?'160%':'240%'):'';
}
$('#pgPrev').onclick=()=>{const it=S.items[S.sel];S.pg=(S.pg-1+it.pages.length)%it.pages.length;renderPreview()};
$('#pgNext').onclick=()=>{const it=S.items[S.sel];S.pg=(S.pg+1)%it.pages.length;renderPreview()};
$('#zIn').onclick=()=>{S.zoom=Math.min(2,S.zoom+1);renderPreview()};
$('#zOut').onclick=()=>{S.zoom=Math.max(0,S.zoom-1);renderPreview()};
function jumpWarn(dir){const n=S.items.length;for(let k=1;k<=n;k++){const i=(S.sel+dir*k+n)%n;if(warnsOf(S.items[i]).length){select(i,true);
 const tr=document.querySelector(`#tbody tr[data-idx="${i}"]`);const m=tr&&tr.querySelector('.miss');if(m)m.focus();return}}}
$('#prevW').onclick=()=>jumpWarn(-1);$('#nextW').onclick=()=>jumpWarn(1);
$('#toStart').onclick=async()=>{if(await modal('처음으로 갈까요?','지금 고친 내용은 저장되지 않아요.',[['취소',0],['처음으로',1,true]]))reset()};
$('#saveBtn').onclick=async()=>{
 if(!S.outDir){const d=await api.choose_folder();if(!d)return;S.outDir=d}
 const wn=S.items.filter(it=>warnsOf(it).length).length;
 if(wn&&!(await modal('확인이 필요한 건이 남아 있어요',`⚠ 표시가 있는 건이 ${wn}건 있어요.\n그래도 저장할까요?`,[['돌아가서 확인',0],['그래도 저장',1,true]])))return;
 $('#saveBtn').disabled=true;$('#saveBtn').textContent='저장 중…';
 const r=await api.save(S.items);$('#saveBtn').disabled=false;
 if(!r.ok&&!r.saved){await modal('저장하지 못했어요',r.msg||'',[['확인',1,true]]);updateSummary();return}
 $('#doneIc').textContent=r.errors.length?'!':'✔';$('#doneIc').classList.toggle('bad',r.errors.length>0);
 $('#doneTitle').textContent=r.errors.length?`${r.saved.length}개 저장, ${r.errors.length}개 실패`:`${r.saved.length}개 파일을 저장했어요`;
 $('#doneDir').textContent=r.folder;
 const list=[...r.errors.map(e=>'⚠ '+e),...r.saved];
 $('#doneFiles').innerHTML=list.slice(0,30).map(esc).join('<br>')+(list.length>30?`<br>… 외 ${list.length-30}개`:'');
 show('done');
};
$('#openDir').onclick=()=>api.open_folder();
$('#again').onclick=()=>reset();
function reset(){S.items=[];S.path='';for(const k in imgCache)delete imgCache[k];$('#thumbs').dataset.for='';renderStart();show('start')}

/* ---------- 시작 */
async function boot(){api=window.pywebview.api;const r=await api.init();
 S.outDir=r.out_dir;S.insurers=r.insurers;S.mode=r.mode||'3종서류';S.cat=r.cat||'';renderStart();
 if(r.first_file)window.onPicked(r.first_file)}
if(window.pywebview&&window.pywebview.api&&window.pywebview.api.init)boot();else window.addEventListener('pywebviewready',boot);
</script>
</body></html>
